<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 3 29 10.5v11L16 29 3 21.5v-11z%22 fill=%22%23c27f35%22/%3E%3Cpath d=%22M16 3 29 10.5 16 18 3 10.5z%22 fill=%22%23e3c08f%22/%3E%3C/svg%3E" />
    <title>Oficina en vivo</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1 id="agency">Estudio Brasa</h1>
        <p id="project" class="project"></p>
      </div>
      <div class="clock" aria-live="off">
        <span class="clock-day" id="clock-day"></span>
        <span class="clock-time" id="clock-time"></span>
      </div>
      <div class="speed" role="radiogroup" aria-label="Velocidad de la simulación" id="speed"></div>
      <dl class="kpis" id="kpis"></dl>
      <div class="top-actions">
        <button class="btn" id="edit-room" type="button" aria-pressed="false"></button>
        <button class="btn btn-icon" id="theme" type="button"></button>
        <button class="btn btn-ghost" id="reset" type="button"></button>
      </div>
    </header>

    <main class="layout">
      <section class="stage" id="stage" aria-label="Oficina en 3D">
        <div class="stage-hint" id="stage-hint">Arrastra para girar · rueda para acercar · clic en una persona</div>
        <div class="stage-hint stage-hint-edit" id="edit-hint" hidden>Pulsa un objeto para seleccionarlo y arrástralo para moverlo · arrastra el suelo para girar la vista</div>
        <ul class="legend" id="legend" aria-label="Roles"></ul>
      </section>

      <aside class="panel">
        <div class="tabs" role="tablist" aria-label="Panel">
          <button role="tab" id="tab-team" aria-controls="pane-team" aria-selected="true">Equipo</button>
          <button role="tab" id="tab-tasks" aria-controls="pane-tasks" aria-selected="false" tabindex="-1">Tareas</button>
          <button role="tab" id="tab-feed" aria-controls="pane-feed" aria-selected="false" tabindex="-1">Actividad</button>
        </div>
        <div class="pane" role="tabpanel" id="pane-team" aria-labelledby="tab-team"></div>
        <div class="pane" role="tabpanel" id="pane-tasks" aria-labelledby="tab-tasks" hidden></div>
        <div class="pane" role="tabpanel" id="pane-feed" aria-labelledby="tab-feed" hidden></div>
        <div class="pane pane-room" id="pane-room" hidden></div>
        <footer class="room-foot" id="room-foot" hidden></footer>
      </aside>
    </main>

    <dialog id="task-dialog" class="dialog"></dialog>
    <dialog id="confirm-dialog" class="dialog dialog-sm"></dialog>
    <dialog id="look-dialog" class="dialog dialog-look" aria-label="Personalizar aspecto"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
